<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图文卡片生成器</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: #f2f4f8; color: #1c2333;
    overflow-x: hidden;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .tip { color: #6b7688; font-size: 13px; margin-bottom: 18px; max-width: 100%; }
  .wrap { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .panel {
    background: #fff; border-radius: 14px; padding: 18px;
    box-shadow: 0 2px 12px rgba(20,30,60,.08);
  }
  .left { width: 100%; max-width: 460px; }
  .right { flex: 1; min-width: 300px; text-align: center; }
  label { display: block; font-size: 12px; color: #6b7688; margin: 10px 0 4px; }
  input, select {
    width: 100%; padding: 8px 10px; font-size: 14px;
    border: 1px solid #d8dee9; border-radius: 8px;
    font-family: inherit; background: #fbfcfe;
  }
  input:focus, select:focus { outline: 2px solid #4c8dff33; border-color: #4c8dff; }
  .row { display: grid; grid-template-columns: 1fr 78px; gap: 8px; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .item {
    border: 1px solid #e6eaf2; border-radius: 10px;
    padding: 8px 10px 12px; margin-bottom: 10px; background: #fafbfe;
  }
  .item b { font-size: 12px; color: #4c8dff; }
  canvas {
    display: block; margin: 0 auto; height: auto;
    width: 100%; max-width: 420px;
    border-radius: 12px; box-shadow: 0 6px 24px rgba(20,30,60,.16);
  }
  button {
    margin-top: 16px; width: 100%; padding: 13px; font-size: 16px;
    border: 0; border-radius: 10px; background: #1f6fff; color: #fff;
    font-weight: 700; cursor: pointer;
  }
  button:hover { background: #0f5ce8; }
  button.ghost { background: #eef2f9; color: #55607a; font-weight: 500; margin-top: 10px; }
  button.ghost:hover { background: #e2e8f4; }
  .switch { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: #6b7688; }
  .switch input { width: auto; }
  .switch label { margin: 0; font-size: 13px; }
  @media (max-width: 760px) {
    body { padding: 12px; }
    .wrap { gap: 14px; }
    .left, .right { width: 100%; max-width: 100%; min-width: 0; flex: 0 0 auto; }
    .right { order: -1; }
    canvas { max-width: 100%; }
  }
</style>
</head>
<body>

<h1>图文卡片生成器</h1>
<div class="tip">改左边的内容，右边实时出图，下载就能发。填过的东西会自动存下来，下次打开还在。</div>

<div class="wrap">
  <div class="panel left">
    <label>标题</label>
    <input id="title">

    <div class="g2">
      <div>
        <label>副标题</label>
        <input id="subtitle">
      </div>
      <div>
        <label>配色</label>
        <select id="theme">
          <option value="dark">深蓝 · 金色</option>
          <option value="ink">纯黑 · 青色</option>
          <option value="light">白底 · 简约</option>
          <option value="warm">暖橙 · 活力</option>
          <option value="pink">浅粉 · 少女</option>
        </select>
      </div>
    </div>

    <div class="g3">
      <div>
        <label>样式</label>
        <select id="layout">
          <option value="pill">胶囊（新版）</option>
          <option value="classic">经典（方块列表）</option>
        </select>
      </div>
      <div>
        <label>风格方向</label>
        <select id="style">
          <option value="mixed">混搭（推荐）</option>
          <option value="minimal">极简大标题</option>
          <option value="magazine">杂志编辑</option>
          <option value="geo">几何数据</option>
        </select>
      </div>
      <div>
        <label>尺寸</label>
        <select id="ratio">
          <option value="1440">3:4（抖音图文）</option>
          <option value="1350">4:5（小红书）</option>
          <option value="1080">1:1（方图）</option>
          <option value="1920">9:16（竖版长图）</option>
        </select>
      </div>
    </div>

    <div class="g3">
      <div>
        <label>行数</label>
        <select id="count">
          <option>3</option><option>4</option><option selected>5</option>
          <option>6</option><option>8</option>
        </select>
      </div>
      <div>
        <label>顶部标签（可留空）</label>
        <input id="tag" placeholder="比如 做图笔记">
      </div>
      <div>
        <label>品牌水印</label>
        <input id="brand" placeholder="比如 @你的账号">
      </div>
    </div>

    <div id="items"></div>

    <label>底部文字（胶囊样式里是结论条）</label>
    <input id="footer">

    <div class="switch">
      <input type="checkbox" id="wm">
      <label for="wm">加"示例数据"水印（预览时防误发）</label>
    </div>

    <button id="save">下载图片</button>
    <button id="reset" class="ghost">清空重填</button>
  </div>

  <div class="panel right">
    <canvas id="cv" width="1080" height="1440"></canvas>
  </div>
</div>

<script>
const W = 1080;
const SIZES = { "1440": "3-4", "1350": "4-5", "1080": "1-1", "1920": "9-16" };
const KEY = "card-maker-v1";

const THEMES = {
  dark:  { bg:"#0B1020", card:"#141B30", accent:"#FFC940", text:"#F0F4FF", sub:"#96A2BE", line:"#2C3758", extra:"#33E0FF" },
  ink:   { bg:"#0A0A0C", card:"#16161A", accent:"#33E0FF", text:"#F5F7FA", sub:"#8E93A3", line:"#2A2A32", extra:"#7CF7B0" },
  light: { bg:"#FFFFFF", card:"#F4F6FA", accent:"#1F6FFF", text:"#141A28", sub:"#77808F", line:"#E2E7F0", extra:"#D9480F" },
  warm:  { bg:"#1A0F08", card:"#2A1A0E", accent:"#FF8A3D", text:"#FFF6EE", sub:"#C69C82", line:"#45291A", extra:"#FFD166" },
  pink:  { bg:"#FFF5F8", card:"#FFFFFF", accent:"#FF4D8D", text:"#2A1520", sub:"#A0808C", line:"#FFD9E5", extra:"#7A5AF8" }
};

const BLANK = ["", "", "", ""];

const FONT_SANS = '"Microsoft YaHei","PingFang SC",sans-serif';
const FONT_SERIF = '"SimSun","Songti SC","STSong",serif';

// 三种风格方向（参考 banner-design 技能的 22 种艺术方向，挑了适合图文号的三种）
const VARIANTS = {
  mixed:    { titleSize: 82, font: "sans",  weight: "800",
              tag: "pill",  capFill: "#FFFFFF", capLine: true,  badge: "circle", decor: "mix" },
  minimal:  { titleSize: 84, font: "sans",  weight: "800",
              tag: "pill",  capFill: "#FFFFFF", capLine: true,  badge: "circle", decor: "none" },
  magazine: { titleSize: 76, font: "serif", weight: "700",
              tag: "plain", capFill: null,      capLine: false, badge: "number", decor: "rule" },
  geo:      { titleSize: 78, font: "sans",  weight: "800",
              tag: "pill",  capFill: "#FFFFFF", capLine: false, badge: "square", decor: "shapes" }
};

function variant() { return VARIANTS[state.style] || VARIANTS.minimal; }

function today() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function freshRows(n) {
  const sample = [
    ["第 1 个", "9.9", "一句话说清它好在哪", "备注：补充说明"],
    ["第 2 个", "9.5", "一句话说清它好在哪", ""],
    ["第 3 个", "9.2", "一句话说清它好在哪", ""],
    ["第 4 个", "8.8", "一句话说清它好在哪", ""],
    ["第 5 个", "8.5", "一句话说清它好在哪", ""]
  ];
  const out = [];
  for (let i = 0; i < n; i++) out.push((sample[i] || BLANK).slice());
  return out;
}

let state = {
  layout: "pill",
  style: "mixed",
  title: "今日推荐",
  subtitle: today() + " · 每日更新",
  theme: "light",
  ratio: "1440",
  count: 5,
  tag: "做图笔记",
  footer: "风格为内容服务，不是堆效果",
  brand: "",
  wm: false,
  page: 0,
  total: 0,
  rows: freshRows(5)
};

// ---------- 存取草稿 ----------
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.rows && s.rows.length) state = Object.assign(state, s);
    }
  } catch (e) {}
}

// ---------- 表单 ----------
function fillForm() {
  document.getElementById("layout").value = state.layout || "pill";
  document.getElementById("style").value = state.style || "mixed";
  document.getElementById("title").value = state.title;
  document.getElementById("subtitle").value = state.subtitle;
  document.getElementById("theme").value = state.theme;
  document.getElementById("ratio").value = state.ratio;
  document.getElementById("count").value = state.count;
  document.getElementById("tag").value = state.tag || "";
  document.getElementById("footer").value = state.footer;
  document.getElementById("brand").value = state.brand;
  document.getElementById("wm").checked = !!state.wm;
}

function buildInputs() {
  const box = document.getElementById("items");
  box.innerHTML = "";
  state.rows.forEach((r, i) => {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML =
      '<b>第 ' + (i + 1) + ' 行</b>' +
      '<div class="row"><input data-k="0" placeholder="名称" value="' + esc(r[0]) + '">' +
      '<input data-k="1" placeholder="数值" value="' + esc(r[1]) + '"></div>' +
      '<label>点评</label><input data-k="2" value="' + esc(r[2]) + '">' +
      '<label>备注（可留空）</label><input data-k="3" value="' + esc(r[3]) + '">';
    el.querySelectorAll("input").forEach(inp => {
      inp.addEventListener("input", () => {
        state.rows[i][+inp.dataset.k] = inp.value;
        save(); render();
      });
    });
    box.appendChild(el);
  });
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/"/g, "&quot;")
    .replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ---------- 画图 ----------
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrap(ctx, text, maxW) {
  const lines = [];
  let cur = "";
  for (const ch of text) {
    if (ctx.measureText(cur + ch).width <= maxW) cur += ch;
    else { lines.push(cur); cur = ch; }
  }
  if (cur) lines.push(cur);
  return lines;
}

// ---------- 颜色工具 ----------
function hex2rgb(h) {
  h = String(h).replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function rgb2hex(a) {
  return "#" + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
}
function mix(c1, c2, t) {
  const a = hex2rgb(c1), b = hex2rgb(c2);
  return rgb2hex(a.map((v, i) => v + (b[i] - v) * t));
}
function lum(c) {
  const [r, g, b] = hex2rgb(c);
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
}
function rgba(c, a) {
  const [r, g, b] = hex2rgb(c);
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}
function star(ctx, cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = -Math.PI / 2 + i * Math.PI / 5;
    const rr = (i % 2) ? r * 0.45 : r;
    const x = cx + Math.cos(ang) * rr, y = cy + Math.sin(ang) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
}
function arrowDown(ctx, cx, y, size, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(3, size * 0.14);
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(cx, y); ctx.lineTo(cx, y + size * 0.72); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - size * 0.32, y + size * 0.42);
  ctx.lineTo(cx, y + size * 0.75);
  ctx.lineTo(cx + size * 0.32, y + size * 0.42);
  ctx.stroke();
}

// ---------- 胶囊样式 ----------
function drawPill(ctx, H, t, FONT, px) {
  const V = variant();
  const TFONT = V.font === "serif" ? FONT_SERIF : FONT;
  let accent = t.accent;
  if (lum(accent) > 0.58) accent = mix(accent, "#000000", 0.36);
  const ink = "#101426", sub = "#6B7280", line = mix("#FFFFFF", accent, 0.22);

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#FFFFFF");
  g.addColorStop(1, mix("#FFFFFF", accent, 0.10));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const rg = ctx.createRadialGradient(W * 0.88, H * 0.04, 0, W * 0.88, H * 0.04, W * 0.8);
  rg.addColorStop(0, rgba(accent, 0.16));
  rg.addColorStop(1, rgba(accent, 0));
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H * 0.66);

  if (V.decor === "shapes") {
    ctx.globalAlpha = 0.09;
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.arc(W * 1.02, H * 0.10, px(230), 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(W * -0.04, H * 0.92, px(160), 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.textBaseline = "top";
  ctx.textAlign = "left";

  const PAD = px(72);
  let y = px(58);

  if (state.tag) {
    const fs0 = px(28);
    if (V.tag === "plain") {
      ctx.font = "600 " + fs0 + "px " + FONT;
      ctx.fillStyle = ink;
      ctx.fillText(state.tag, PAD, y);
      const tw = ctx.measureText(state.tag).width;
      ctx.fillStyle = accent;
      ctx.fillRect(PAD, y + fs0 + px(10), tw, px(5));
      y += fs0 + px(34);
    } else {
      ctx.font = "600 " + fs0 + "px " + FONT;
      const tw = ctx.measureText(state.tag).width;
      const ph = px(58), pw = tw + px(52);
      ctx.fillStyle = accent;
      roundRect(ctx, PAD, y, pw, ph, ph / 2);
      ctx.fill();
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText(state.tag, PAD + px(26), y + (ph - fs0) / 2);
      y += ph + px(32);
    }
  } else {
    y += px(12);
  }

  if (state.page && state.total) {
    const s = String(state.page).padStart(2, "0") + "/" + String(state.total).padStart(2, "0");
    const fs1 = px(26);
    ctx.font = "600 " + fs1 + "px " + FONT;
    const tw = ctx.measureText(s).width;
    const ph = px(52), pw = tw + px(40);
    ctx.fillStyle = "rgba(16,20,38,0.06)";
    roundRect(ctx, W - PAD - pw, px(58), pw, ph, ph / 2);
    ctx.fill();
    ctx.fillStyle = sub;
    ctx.fillText(s, W - PAD - pw + px(20), px(58) + (ph - fs1) / 2);
  }

  const tfs = px(V.titleSize);
  const tlines = wrap(ctx, state.title || "标题", W - PAD * 2).slice(0, 2);
  ctx.fillStyle = ink;
  ctx.font = V.weight + " " + tfs + "px " + TFONT;
  const tLead = Math.round(tfs * 1.18);
  tlines.forEach((ln, i) => ctx.fillText(ln, PAD, y + i * tLead));
  y += tlines.length * tLead + px(8);

  if (state.subtitle) {
    const sfs = px(30);
    const slines = wrap(ctx, state.subtitle, W - PAD * 2).slice(0, 2);
    ctx.fillStyle = sub;
    ctx.font = "400 " + sfs + "px " + FONT;
    slines.forEach((ln, i) => ctx.fillText(ln, PAD, y + i * px(44)));
    y += slines.length * px(44);
  }

  if (V.decor === "rule" || V.decor === "mix") {
    ctx.strokeStyle = line;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(PAD, y + px(20));
    ctx.lineTo(W - PAD, y + px(20));
    ctx.stroke();
    y += px(34);
  }

  const rows = state.rows.filter(r => (r[0] || "").trim());
  const n = Math.max(rows.length, 1);
  const bottomLimit = H - px(state.footer ? 206 : 116);
  const areaTop = y + px(36);
  const slot = (bottomLimit - areaTop) / n;
  const gap = Math.min(px(36), slot * 0.24);
  const capH = slot - gap;

  rows.forEach((r, i) => {
    const cy = areaTop + i * slot;
    const x = PAD, cw = W - PAD * 2;
    const radius = V.capFill ? Math.min(capH / 2, px(42)) : 0;
    if (V.capFill) {
      ctx.fillStyle = V.capFill;
      roundRect(ctx, x, cy, cw, capH, radius);
      ctx.fill();
    }
    if (V.capLine) {
      ctx.lineWidth = 2;
      ctx.strokeStyle = line;
      ctx.stroke();
    }
    if (!V.capFill && !V.capLine) {
      ctx.strokeStyle = line;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, cy + capH - px(4));
      ctx.lineTo(x + cw, cy + capH - px(4));
      ctx.stroke();
    }

    const d = Math.min(px(74), capH * 0.58);
    const bcx = x + px(24) + d / 2, bcy = cy + capH / 2;
    const nfs = Math.round(d * 0.46);
    if (V.badge === "circle") {
      ctx.fillStyle = accent;
      ctx.beginPath(); ctx.arc(bcx, bcy, d / 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#FFFFFF";
    } else if (V.badge === "square") {
      ctx.fillStyle = accent;
      roundRect(ctx, bcx - d / 2, bcy - d / 2, d, d, px(20));
      ctx.fill();
      ctx.fillStyle = "#FFFFFF";
    } else {
      ctx.fillStyle = accent;
    }
    ctx.font = "700 " + nfs + "px " + FONT;
    const nw = ctx.measureText(String(i + 1)).width;
    ctx.fillText(String(i + 1), bcx - nw / 2, bcy - nfs / 2 + px(1));

    const tx = bcx + d / 2 + px(26);
    const hasValue = !!(r[1] || "").trim();
    const rightW = hasValue ? px(190) : 0;
    const nameFs = Math.min(px(42), Math.round(capH * 0.30));
    const noteFs = Math.min(px(26), Math.round(capH * 0.20));
    const textW = cw - (tx - x) - rightW - px(28);

    const ty = cy + capH / 2 - (r[2] ? nameFs * 0.78 : nameFs * 0.5);
    ctx.fillStyle = ink;
    ctx.font = "700 " + nameFs + "px " + FONT;
    ctx.fillText(wrap(ctx, r[0], textW)[0] || "", tx, ty);

    if (r[2]) {
      ctx.fillStyle = sub;
      ctx.font = "400 " + noteFs + "px " + FONT;
      const nl = wrap(ctx, r[2], textW);
      ctx.fillText(nl[0], tx, ty + nameFs + px(12));
      if (nl.length > 1 && capH > px(150)) {
        ctx.fillText(nl[1], tx, ty + nameFs + px(12) + noteFs + px(8));
      }
    }

    if (hasValue) {
      const vfs = Math.min(px(42), Math.round(capH * 0.30));
      ctx.fillStyle = accent;
      ctx.font = "700 " + vfs + "px " + FONT;
      const vw = ctx.measureText(r[1]).width;
      ctx.fillText(r[1], x + cw - px(32) - vw, cy + capH / 2 - vfs / 2);
    }

    if ((r[3] || "").trim() && capH > px(185)) {
      const efs = Math.min(px(25), Math.round(capH * 0.165));
      ctx.fillStyle = accent;
      ctx.font = "600 " + efs + "px " + FONT;
      ctx.fillText(wrap(ctx, r[3], textW)[0], tx, cy + capH - px(26) - efs);
    }

    if (i < n - 1) {
      arrowDown(ctx, W / 2, cy + capH + gap * 0.12, gap * 0.7, rgba(accent, 0.7));
    }
  });

  if (state.footer) {
    const bh = px(100);
    const by = H - px(162);
    ctx.fillStyle = accent;
    roundRect(ctx, PAD, by, W - PAD * 2, bh, bh / 2);
    ctx.fill();
    const ccx = PAD + px(54), ccy = by + bh / 2, r0 = px(27);
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath(); ctx.arc(ccx, ccy, r0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = accent;
    star(ctx, ccx, ccy, r0 * 0.62);
    const ffs = px(32);
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "700 " + ffs + "px " + FONT;
    ctx.fillText(wrap(ctx, state.footer, W - PAD * 2 - px(170))[0], ccx + r0 + px(22), by + (bh - ffs) / 2);
  }

  if (state.brand) {
    const bfs = px(24);
    ctx.fillStyle = sub;
    ctx.font = "600 " + bfs + "px " + FONT;
    const bw2 = ctx.measureText(state.brand).width;
    ctx.fillText(state.brand, W - PAD - bw2, H - px(44));
  }

  if (state.wm) {
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(-Math.PI / 6);
    ctx.globalAlpha = 0.32;
    ctx.fillStyle = "#FF4646";
    ctx.font = "700 " + px(104) + "px " + FONT;
    ctx.textAlign = "center";
    ctx.fillText("示例数据 · 请替换", 0, -px(50));
    ctx.restore();
    ctx.textAlign = "left";
  }
}

function render() {
  const t = THEMES[state.theme] || THEMES.dark;
  const cv = document.getElementById("cv");
  const H = +state.ratio;
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const ctx = cv.getContext("2d");
  const FONT = '"Microsoft YaHei","PingFang SC",sans-serif';
  const k = H / 1440;
  const px = n => Math.round(n * k);

  ctx.clearRect(0, 0, W, H);

  if ((state.layout || "pill") === "pill") {
    drawPill(ctx, H, t, FONT, px);
    return;
  }

  ctx.fillStyle = t.bg;
  ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = "top";
  ctx.textAlign = "left";

  // 标题左侧竖条
  ctx.fillStyle = t.accent;
  ctx.fillRect(60, px(84), 10, px(58));
  ctx.fillStyle = t.text;
  ctx.font = "700 " + px(64) + "px " + FONT;
  ctx.fillText(state.title || "标题", 90, px(78));

  if (state.subtitle) {
    ctx.fillStyle = t.accent;
    ctx.font = "400 " + px(28) + "px " + FONT;
    ctx.fillText(state.subtitle, 60, px(164));
  }

  ctx.strokeStyle = t.line;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(60, px(222)); ctx.lineTo(W - 60, px(222)); ctx.stroke();

  const rows = state.rows.filter(r => (r[0] || "").trim());
  const n = Math.max(rows.length, 1);
  const top = px(262);
  const bottom = H - px(110);
  const rowH = (bottom - top) / n;
  const showExtra = rowH >= px(150);
  // 行数多的时候自动缩小字号，避免挤在一起
  const df = Math.max(0.72, Math.min(1, rowH / 165));
  const fs = v => Math.round(v * df);

  rows.forEach((r, i) => {
    const y = top + i * rowH;
    const cardH = rowH - px(22);
    ctx.fillStyle = t.card;
    roundRect(ctx, 50, y, W - 100, cardH, 18);
    ctx.fill();

    // 卡片左侧色条
    ctx.fillStyle = t.accent;
    ctx.fillRect(50, y + px(18), px(10), Math.max(px(20), cardH - px(36)));

    // 序号做成徽章
    const bw = px(54), bh = px(54);
    const bx = 82, by = y + rowH * 0.13;
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = t.accent;
    roundRect(ctx, bx, by, bw, bh, px(15));
    ctx.fill();
    ctx.globalAlpha = 1;
    const nfs = fs(px(32));
    ctx.fillStyle = t.accent;
    ctx.font = "700 " + nfs + "px " + FONT;
    const nw = ctx.measureText(String(i + 1)).width;
    ctx.fillText(String(i + 1), bx + (bw - nw) / 2, by + (bh - nfs) / 2 + px(3));

    ctx.fillStyle = t.text;
    ctx.font = "700 " + fs(px(42)) + "px " + FONT;
    ctx.fillText(r[0], 154, y + rowH * 0.16);

    if (r[1]) {
      ctx.fillStyle = t.accent;
      ctx.font = "700 " + fs(px(50)) + "px " + FONT;
      const w = ctx.measureText(r[1]).width;
      ctx.fillText(r[1], W - 84 - w, y + rowH * 0.14);
    }

    if (r[2]) {
      ctx.fillStyle = t.sub;
      ctx.font = "400 " + fs(px(26)) + "px " + FONT;
      wrap(ctx, r[2], W - 264).slice(0, showExtra ? 2 : 1).forEach((ln, j) => {
        ctx.fillText(ln, 154, y + rowH * 0.46 + j * fs(px(34)));
      });
    }

    if (showExtra && r[3]) {
      ctx.fillStyle = t.extra;
      ctx.font = "400 " + fs(px(24)) + "px " + FONT;
      ctx.fillText(r[3], 154, y + rowH * 0.76);
    }
  });

  // 底部色带
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = t.accent;
  ctx.fillRect(0, H - px(10), W, px(10));
  ctx.globalAlpha = 1;

  if (state.footer) {
    ctx.fillStyle = t.sub;
    ctx.font = "400 " + px(22) + "px " + FONT;
    ctx.fillText(state.footer, 60, H - px(66));
  }

  if (state.brand) {
    ctx.fillStyle = t.accent;
    ctx.font = "700 " + px(24) + "px " + FONT;
    const w = ctx.measureText(state.brand).width;
    ctx.fillText(state.brand, W - 60 - w, H - px(70));
  }

  if (state.wm) {
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(-Math.PI / 6);
    ctx.globalAlpha = 0.42;
    ctx.fillStyle = "#FF4646";
    ctx.font = "700 " + px(104) + "px " + FONT;
    ctx.textAlign = "center";
    ctx.fillText("示例数据 · 请替换", 0, -px(50));
    ctx.restore();
    ctx.textAlign = "left";
  }
}

function refresh() { save(); render(); }

// ---------- 绑定 ----------
["title", "subtitle", "footer", "brand", "tag"].forEach(id => {
  document.getElementById(id).addEventListener("input", e => {
    state[id] = e.target.value; refresh();
  });
});
["theme", "ratio", "wm", "layout", "style"].forEach(id => {
  document.getElementById(id).addEventListener("change", e => {
    state[id] = (e.target.type === "checkbox") ? e.target.checked : e.target.value;
    refresh();
  });
});
document.getElementById("count").addEventListener("change", e => {
  const n = +e.target.value;
  while (state.rows.length < n) state.rows.push(BLANK.slice());
  state.rows = state.rows.slice(0, n);
  state.count = n;
  buildInputs(); refresh();
});

document.getElementById("save").addEventListener("click", () => {
  const a = document.createElement("a");
  a.download = "卡片-" + today() + "-" + SIZES[state.ratio] + ".png";
  a.href = document.getElementById("cv").toDataURL("image/png");
  a.click();
});

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("清空当前内容，重新填？")) return;
  state = {
    layout: "pill",
    style: "mixed",
    title: "今日推荐", subtitle: today() + " · 每日更新",
    theme: "light", ratio: "1440", count: 5,
    tag: "做图笔记", footer: "风格为内容服务，不是堆效果",
    brand: "", wm: false, page: 0, total: 0,
    rows: freshRows(5)
  };
  fillForm(); buildInputs(); refresh();
});

load();
fillForm();
buildInputs();
render();
</script>

</body>
